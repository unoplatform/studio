name: uno-lint

on:
  pull_request:
    branches:
      - main
      - release/stable/**
    paths:
      - 'tools/uno-lint/**'
      - '.github/workflows/uno-lint.yml'
  push:
    branches:
      - main
    paths:
      - 'tools/uno-lint/**'
      - '.github/workflows/uno-lint.yml'

permissions:
  contents: read

jobs:
  build-test:
    name: Build and test tools/uno-lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    defaults:
      run:
        working-directory: tools/uno-lint

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build -c Release

      - name: Test
        run: dotnet test tests/Uno.Lint.Tests -c Release --no-build --logger "trx;LogFileName=uno-lint.trx"

      - name: Pack the tool
        run: dotnet pack src/Uno.Lint.Cli -c Release --no-build -o artifacts

      - name: Self-check the rule catalog
        run: dotnet src/Uno.Lint.Cli/bin/Release/net10.0/uno-lint.dll --list-rules

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: uno-lint-${{ matrix.os }}
          path: |
            tools/uno-lint/artifacts/*.nupkg
            tools/uno-lint/tests/Uno.Lint.Tests/TestResults/*.trx
