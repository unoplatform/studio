name: Evals

# Runs the skill evals (evals/README.md) with the repository's API key, so contributors need no Claude credentials. A
# pull request runs only the suites whose inputs it changes; the weekly run on main runs them all, to catch a change of
# model or of Claude Code that no diff shows, and anything a fork pull request merged without a run.
on:
  pull_request:
    branches:
      - main
      - release/stable/**
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    # Sunday 05:00 UTC.
    - cron: '0 5 * * 0'
  workflow_dispatch:
    inputs:
      suites:
        description: Suites to run (folders under evals/), comma-separated, or all
        default: all

permissions:
  contents: read

# A push to a pull request cancels its run in progress: only the latest commit's result counts.
concurrency:
  group: evals-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  evals:
    name: Evals
    runs-on: ubuntu-latest
    timeout-minutes: 60

    # No `paths:` filter on the trigger: a workflow it skips leaves a required check pending. The job runs on every pull
    # request instead, and stops after picking the suites when none of their inputs changed.
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Fork pull requests get no secrets, so they run nothing here; the weekly run covers them once merged. A draft runs
      # when it's marked ready for review.
      - name: Skip forks and drafts
        id: skip
        if: github.event_name == 'pull_request' && (github.event.pull_request.draft || github.event.pull_request.head.repo.full_name != github.repository)
        env:
          DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          if [ "$DRAFT" = true ]; then
            echo "::notice::Evals run when this draft is marked ready for review."
          else
            echo "::notice::Evals don't run on pull requests from forks, which get no secrets. Run them locally with pwsh .github/scripts/Invoke-Evals.ps1 (evals/README.md); the weekly run on main covers this change once it merges."
          fi

      - name: Pick the suites
        id: plan
        if: steps.skip.conclusion == 'skipped'
        shell: pwsh
        env:
          SUITES: ${{ github.event_name == 'schedule' && 'all' || inputs.suites }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: ./.github/scripts/Invoke-Evals.ps1 -Suite $env:SUITES -Base $env:BASE -List

      - uses: actions/setup-node@v5
        if: steps.plan.outputs.suites
        with:
          node-version: 22

      # A version with `claude plugin eval` (2.1.269 or later); the same one the suites were last run with locally.
      - name: Install Claude Code
        if: steps.plan.outputs.suites
        run: npm install -g @anthropic-ai/claude-code@2.1.317

      - name: Run the evals
        if: steps.plan.outputs.suites
        shell: pwsh
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_EVALS_API_KEY }}
          SUITES: ${{ steps.plan.outputs.suites }}
        run: |
          if (-not $env:ANTHROPIC_API_KEY) {
            Write-Host '::error::The ANTHROPIC_EVALS_API_KEY secret is not set. A repository admin adds it under Settings > Secrets and variables > Actions.'
            exit 1
          }
          ./.github/scripts/Invoke-Evals.ps1 -Suite $env:SUITES -OutputDir evals/results/ci

      - uses: actions/upload-artifact@v7
        if: always() && steps.plan.outputs.suites
        with:
          name: eval-results
          path: evals/results/ci/
          if-no-files-found: ignore
