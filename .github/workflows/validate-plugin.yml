name: Validate Plugin

on:
  pull_request:
    branches:
      - main
      - release/stable/**
  push:
    branches:
      - main
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    name: Validate plugin and skills
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.282

      - name: Validate manifests and skills
        run: |
          claude plugin validate . --strict
          claude plugin validate plugins/uno-platform-studio --strict

      # The open skill format that Codex, Copilot, Cursor and other agents read. Stricter than
      # Claude Code: only spec fields (so no `when_to_use`) and descriptions up to 1,024 chars.
      - name: Validate skills against the Agent Skills spec
        run: |
          pipx install skills-ref==0.1.1
          for skill in plugins/uno-platform-studio/skills/*/; do
            agentskills validate "$skill"
          done

      - name: Repo checks
        shell: pwsh
        run: ./.github/scripts/Test-Plugin.ps1

      # Agents install whatever tag source.ref names (Test-Plugin.ps1 keeps every ref equal to the
      # plugin version). That tag must be a published release, and a PR must not move the branch back
      # to an older one. A release run passes too: it validates before stamping the next version.
      - name: Marketplaces point at a published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          manifest=plugins/uno-platform-studio/.claude-plugin/plugin.json
          version=$(jq -r .version "$manifest")
          case "$version" in ''|null) echo "::error::$manifest has no version"; exit 1;; esac
          if ! gh release view "$version" --repo "$GITHUB_REPOSITORY" --json tagName >/dev/null; then
            echo "::error::source.ref '$version' is not a published release of $GITHUB_REPOSITORY"
            exit 1
          fi
          if [ -n "$GITHUB_BASE_REF" ]; then
            git fetch --depth=1 origin "$GITHUB_BASE_REF"
            base=$(git show "origin/$GITHUB_BASE_REF:$manifest" | jq -r .version)
            if [ "$(printf '%s\n' "$base" "$version" | sort -V | head -1)" != "$base" ]; then
              echo "::error::This PR moves the marketplaces from $base back to $version"
              exit 1
            fi
          fi

  agents:
    name: Install in Copilot CLI and Codex
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install Copilot CLI and Codex
        run: npm install -g @github/copilot@1.0.3 @openai/codex@0.154.0

      - name: Install the plugin in each agent
        shell: pwsh
        run: ./.github/scripts/Test-AgentInstall.ps1
