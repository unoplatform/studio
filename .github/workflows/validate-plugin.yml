name: Validate Plugin

on:
  pull_request:
    branches:
      - main
      - release/stable/**
  push:
    branches:
      - main
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    name: Validate plugin and skills
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.282

      - name: Validate manifests and skills
        run: |
          claude plugin validate . --strict
          claude plugin validate plugins/uno-platform-studio --strict

      # The open skill format that Codex, Copilot, Cursor and other agents read. Stricter than
      # Claude Code: only spec fields (so no `when_to_use`) and descriptions up to 1,024 chars.
      - name: Validate skills against the Agent Skills spec
        run: |
          pipx install skills-ref==0.1.1
          for skill in plugins/uno-platform-studio/skills/*/; do
            agentskills validate "$skill"
          done

      - name: Repo checks
        shell: pwsh
        run: ./.github/scripts/Test-Plugin.ps1
