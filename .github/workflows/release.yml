name: Release

# Releases ship from release/stable/<major>.<minor> branches, like the other Uno Platform repos,
# and wait for approval on the plugin-release environment. Each approved push releases the next
# <major>.<minor>.<patch>: the version is stamped into every manifest in a commit on top of the branch
# head, that commit is tagged and published (the branch itself requires pull requests, so it is not
# pushed there), and a PR moves the marketplaces on main (the ones agents read) to the new tag.
on:
  push:
    branches:
      - release/stable/**

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/validate-plugin.yml

  release:
    name: Tag and publish release
    needs: validate
    runs-on: ubuntu-latest
    environment: plugin-release
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Compute version
        id: version
        run: |
          minor="${GITHUB_REF_NAME#release/stable/}"
          if [[ ! "$minor" =~ ^[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release branches must be named release/stable/<major>.<minor>, got $GITHUB_REF_NAME"
            exit 1
          fi
          # The plugin version tracks the Uno.Sdk major.minor it is built for, so a release waits for that SDK to be stable.
          if ! curl -fsSL https://api.nuget.org/v3-flatcontainer/uno.sdk/index.json | jq -e --arg line "$minor." '.versions | any(startswith($line) and (contains("-") | not))' > /dev/null; then
            echo "::error::Uno.Sdk $minor has no stable release on NuGet yet, so plugin $minor cannot ship (the plugin version tracks the Uno.Sdk it is built for)"
            exit 1
          fi
          last=$(git tag -l "$minor.*" | grep -E "^${minor//./\\.}\.[0-9]+$" | sort -V | tail -1 || true)
          if [ -z "$last" ]; then patch=0; else patch=$(( ${last##*.} + 1 )); fi
          echo "version=$minor.$patch" >> "$GITHUB_OUTPUT"
          echo "Releasing $minor.$patch" >> "$GITHUB_STEP_SUMMARY"

      # The release branches require pull requests, like main, so the stamped commit is not pushed to the
      # branch: only the tag points at it. The next release stamps the branch head again.
      # `git tag` without -a is a lightweight tag. Keep it that way: Codex compares `git ls-remote` output
      # with the checked-out commit, which never matches an annotated tag's object id.
      - name: Stamp the version and tag it
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          pwsh .github/scripts/Set-PluginVersion.ps1 -Version "$VERSION"
          pwsh .github/scripts/Test-Plugin.ps1
          if ! git diff --quiet; then
            git commit -am "chore(release): $VERSION"
          fi
          git tag "$VERSION"
          git push origin "refs/tags/$VERSION"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release create "$VERSION" --title "$VERSION" --generate-notes

      # main is protected, so the marketplaces agents read move to the new tag through a PR.
      # A patch release on an older line never moves main backwards.
      - name: Open a PR pointing main at the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          current=$(git show origin/main:plugins/uno-platform-studio/.claude-plugin/plugin.json | jq -r .version)
          if [ "$(printf '%s\n' "$current" "$VERSION" | sort -V | tail -1)" != "$VERSION" ] || [ "$current" = "$VERSION" ]; then
            echo "main is already at $current, not moving it to $VERSION." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          branch="chore/release-$VERSION"
          git switch -c "$branch" origin/main
          pwsh .github/scripts/Set-PluginVersion.ps1 -Version "$VERSION"
          git commit -am "chore(release): point the marketplaces at $VERSION"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "chore(release): point the marketplaces at $VERSION" \
            --body "Release [$VERSION](https://github.com/${GITHUB_REPOSITORY}/releases/tag/$VERSION) is published. Merging this moves every marketplace's \`source.ref\` to it, which is when agents start installing it."
